<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="DeadlineBox - Never miss a deadline."
    >

    <title>DeadlineBox — Never miss a deadline</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="brand">

            <div class="logo">
                📦
            </div>

            <div>
                <h1>DeadlineBox</h1>
                <p>Never miss a deadline.</p>
            </div>

        </div>


        <div class="header-actions">

            <button
                id="themeToggle"
                class="icon-btn"
                type="button"
                aria-label="Toggle theme"
                title="Toggle theme"
            >
                🌙
            </button>

            <button
                id="addDeadlineBtn"
                class="primary-btn"
                type="button"
            >
                ＋ Add Deadline
            </button>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="container">

        <!-- Statistics -->

        <section class="stats-grid">

            <div class="stat-card today-card">

                <div class="stat-icon">
                    📅
                </div>

                <div>
                    <span>Today</span>
                    <strong id="todayCount">0</strong>
                </div>

            </div>


            <div class="stat-card soon-card">

                <div class="stat-icon">
                    ⏰
                </div>

                <div>
                    <span>Soon</span>
                    <strong id="soonCount">0</strong>
                </div>

            </div>


            <div class="stat-card upcoming-card">

                <div class="stat-icon">
                    🚀
                </div>

                <div>
                    <span>Upcoming</span>
                    <strong id="upcomingCount">0</strong>
                </div>

            </div>


            <div class="stat-card completed-card-stat">

                <div class="stat-icon">
                    ✅
                </div>

                <div>
                    <span>Completed</span>
                    <strong id="completedCount">0</strong>
                </div>

            </div>

        </section>


        <!-- ================= ACTIVE DEADLINES ================= -->

        <section class="section">

            <div class="section-header">

                <div>

                    <h2>
                        My Deadlines
                    </h2>

                    <p>
                        Stay ahead of your work.
                    </p>

                </div>

            </div>


            <div
                id="activeDeadlines"
                class="deadline-list"
            ></div>

        </section>


        <!-- ================= COMPLETED ================= -->

        <section class="section completed-section">

            <div class="section-header">

                <div>

                    <h2>
                        Completed
                    </h2>

                    <p>
                        Your finished deadlines.
                    </p>

                </div>

            </div>


            <div
                id="completedDeadlines"
                class="completed-list"
            ></div>

        </section>

    </main>


    <!-- ================= MODAL ================= -->

    <div
        id="deadlineModal"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
    >

        <div class="modal-content">

            <div class="modal-header">

                <div>

                    <h2 id="modalTitle">
                        Add Deadline
                    </h2>

                    <p>
                        Add something you don't want to forget.
                    </p>

                </div>

                <button
                    id="closeModalBtn"
                    class="modal-close"
                    type="button"
                    aria-label="Close"
                >
                    ×
                </button>

            </div>


            <form id="deadlineForm">

                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        id="subject"
                        type="text"
                        placeholder=""
                        required
                        autocomplete="off"
                    >

                </div>


                <div class="form-group">

                    <label for="task">
                        Task
                    </label>

                    <input
                        id="task"
                        type="text"
                        placeholder=""
                        required
                        autocomplete="off"
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="date">
                            Date
                        </label>

                        <input
                            id="date"
                            type="date"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="time">
                            Time
                        </label>

                        <input
                            id="time"
                            type="time"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="importance">
                        Importance
                    </label>

                    <select
                        id="importance"
                        required
                    >

                        <option value="high">
                            High
                        </option>

                        <option value="medium" selected>
                            Medium
                        </option>

                        <option value="low">
                            Low
                        </option>

                    </select>

                </div>


                <div class="modal-actions">

                    <button
                        id="cancelBtn"
                        type="button"
                        class="secondary-btn"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Add Deadline
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- ================= TOAST ================= -->

    <div
        id="deadlinebox-toast"
        class="toast"
        role="status"
        aria-live="polite"
    ></div>


    <script src="script.js"></script>

</body>
</html>
